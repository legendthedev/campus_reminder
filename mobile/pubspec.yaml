name: campus_reminder
description: Mobile campus class reminder system with GPS geofencing
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^11.0.0
  flutter_local_notifications: ^17.0.0
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.0
  flutter_secure_storage: ^9.0.0
  dio: ^5.4.0
  flutter_riverpod: ^2.5.0
  sqflite: ^2.3.0
  google_maps_flutter: ^2.5.0
  local_auth: ^2.1.0
  connectivity_plus: ^6.0.0
  permission_handler: ^11.3.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
